# Secrets are NOT configured here — only via `wrangler secret put`:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GEMINI_API_KEY,
#   RESEND_API_KEY, ADMIN_SECRET, PORTAL_ORIGIN,
#   GOOGLE_SA_EMAIL, GOOGLE_SA_PRIVATE_KEY, GOOGLE_SHEET_ID
# The same list is documented in the worker.js header; keep them in sync.
#
# The three GOOGLE_* secrets are all-or-nothing for the poll's Sheets sync
# (Feature 1): leaving any of them unset is a safe, working state — voting
# still works, the sync just stays inert and logs why. GOOGLE_SA_PRIVATE_KEY
# is the "private_key" field straight out of the service account's
# downloaded JSON key file, PEM included.

name = "stripe-magiclink"
main = "worker.js"
compatibility_date = "2025-01-01"

# Step 4: tier defaults from which Stripe Price the client checked out with
# (see resolveTierFromCheckoutSession in worker.js). Plain vars, not
# secrets — a Price ID is not sensitive. An unset or unmatched price leaves
# tier as it already is; /api/admin/set-tier is still the manual override.
[vars]
PRICE_ID_REGULAR = "<price-id-for-the-$20-founding-tier>"
PRICE_ID_VIP = "<price-id-for-the-$50-patron-membership>"

# TODO(deploy): replace with the id of the existing namespace —
#   wrangler kv namespace list
kv_namespaces = [
  { binding = "CLIENT_KV", id = "<existing-client-kv-id>" }
]

# TODO(deploy): replace with the id printed by `wrangler d1 create spring-renaissance`
[[d1_databases]]
binding = "DB"
database_name = "spring-renaissance"
database_id = "<id-from-wrangler-d1-create>"
